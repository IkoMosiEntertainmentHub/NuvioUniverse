name: Universe ARM64

on:
  push:
    branches: [cmp-rewrite, universe-arm64]
  pull_request:
    branches: [cmp-rewrite]
  workflow_dispatch:
    inputs:
      release:
        description: Build with your persistent release signing key
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: universe-arm64-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure optional metadata and release signing
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          SIGNING_KEY: ${{ secrets.UNIVERSE_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.UNIVERSE_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.UNIVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNIVERSE_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          python3 scripts/configure-universe.py
          python3 scripts/test_configure_universe.py
      - name: Test shared Android code
        run: ./gradlew :composeApp:testAndroidHostTest --tests 'com.nuvio.app.features.details.UniverseRepositoryTest' --tests 'com.nuvio.app.features.details.UniverseSettingsTest' --tests 'com.nuvio.app.core.auth.RemoteSignInTest' --tests 'com.nuvio.app.features.details.RatingsSettingsTest' --tests 'com.nuvio.app.features.updater.VersionUtilsTest' -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --stacktrace
      - name: Build ARM64 APK
        env:
          RELEASE: ${{ inputs.release || false }}
        run: |
          # Without signing secrets this produces an unsigned release for offline signing.
          variant=Release
          ./gradlew ":androidApp:assembleFull${variant}" -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --stacktrace
      - name: Verify packaged architectures
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apks = list(Path('androidApp/build/outputs/apk/full').rglob('*.apk'))
          assert apks, 'No APK produced'
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  abis = {n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert abis == {'arm64-v8a'}, (apk, abis)
              print(f'{apk.name}: ARM64 only')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: nuvio-universe-arm64-${{ github.run_number }}
          path: androidApp/build/outputs/apk/full/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: universe-test-reports-${{ github.run_number }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore


