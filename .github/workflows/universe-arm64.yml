name: Universe ARM64

on:
  push:
    branches: [cmp-rewrite, universe-arm64]
  pull_request:
    branches: [cmp-rewrite]
  workflow_dispatch:
    inputs:
      release:
        description: Build with your persistent release signing key
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: universe-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure optional metadata and release signing
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          SIGNING_KEY: ${{ secrets.UNIVERSE_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.UNIVERSE_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.UNIVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNIVERSE_KEY_PASSWORD }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          props = {k: os.environ[k] for k in ('TMDB_API_KEY', 'MDBLIST_CLIENT_ID') if os.environ.get(k)}
          if os.environ['RELEASE'] == 'true':
              required = ('SIGNING_KEY', 'SIGNING_PASSWORD', 'SIGNING_ALIAS', 'KEY_PASSWORD')
              if any(not os.environ.get(k) for k in required):
                  raise SystemExit('Add the four UNIVERSE signing secrets before building a release.')
              key = Path(os.environ['RUNNER_TEMP']) / 'universe.jks'
              key.write_bytes(base64.b64decode(os.environ['SIGNING_KEY'], validate=True))
              props.update(NUVIO_RELEASE_STORE_FILE=str(key),
                           NUVIO_RELEASE_STORE_PASSWORD=os.environ['SIGNING_PASSWORD'],
                           NUVIO_RELEASE_KEY_ALIAS=os.environ['SIGNING_ALIAS'],
                           NUVIO_RELEASE_KEY_PASSWORD=os.environ['KEY_PASSWORD'])
          def escape(s):
              return s.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          Path('local.properties').write_text(''.join(f'{k}={escape(v)}\n' for k,v in props.items()))
          PY
      - name: Test shared Android code
        run: ./gradlew :composeApp:testAndroidHostTest --tests 'com.nuvio.app.features.details.UniverseRepositoryTest' -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --stacktrace
      - name: Build ARM64 APK
        env:
          RELEASE: ${{ inputs.release || false }}
        run: |
          variant=Debug
          if [ "$RELEASE" = true ]; then variant=Release; fi
          ./gradlew ":androidApp:assembleFull${variant}" -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --stacktrace
      - name: Verify packaged architectures
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apks = list(Path('androidApp/build/outputs/apk/full').rglob('*.apk'))
          assert apks, 'No APK produced'
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  abis = {n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert abis == {'arm64-v8a'}, (apk, abis)
              print(f'{apk.name}: ARM64 only')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: nuvio-universe-arm64-${{ github.run_number }}
          path: androidApp/build/outputs/apk/full/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: universe-test-reports-${{ github.run_number }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore
