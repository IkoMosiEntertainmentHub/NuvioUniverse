name: Universe Android ARM

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  push:
    branches: [cmp-rewrite, universe-arm64, universe-discovery-controls]
  pull_request:
    branches: [cmp-rewrite]
  workflow_dispatch:
    inputs:
      release:
        description: Build with your persistent release signing key
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: universe-arm-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    # The publishing workflow already runs this job for release commits.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:') || inputs.release == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify independent personal version and official-update preservation
        run: |
          python3 scripts/test_universe_version.py
          python3 scripts/universe_version.py check
          python3 scripts/universe_version.py show
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure optional metadata and release signing
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          SIGNING_KEY: ${{ secrets.UNIVERSE_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.UNIVERSE_KEYSTORE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.UNIVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNIVERSE_KEY_PASSWORD }}
          SIGNING_STORE_TYPE: ${{ vars.UNIVERSE_KEYSTORE_TYPE || 'PKCS12' }}
          RELEASE: ${{ inputs.release || false }}
        run: |
          python3 scripts/configure-universe.py
          python3 scripts/test_configure_universe.py
      - name: Test shared Android code
        run: ./gradlew :composeApp:testAndroidHostTest --tests 'com.nuvio.app.features.details.*Test' --tests 'com.nuvio.app.features.player.skip.*Test' --tests 'com.nuvio.app.features.player.PlayerArtworkTest' --tests 'com.nuvio.app.features.home.components.*Test' --tests 'com.nuvio.app.core.auth.RemoteSignInTest' --tests 'com.nuvio.app.features.updater.*Test' -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --stacktrace
      - name: Build ARMv7 and ARM64 APKs
        env:
          RELEASE: ${{ inputs.release || false }}
        run: |
          # Without signing secrets this produces an unsigned release for offline signing.
          variant=Release
          ./gradlew ":androidApp:assembleFull${variant}" -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" --stacktrace
      - name: Verify packaged architectures
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apks = list(Path('androidApp/build/outputs/apk/full').rglob('*.apk'))
          assert len(apks) == 2, f'Expected two architecture-specific APKs, got {apks}'
          packaged = set()
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  abis = {n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')}
                  libraries = {n.rsplit('/', 1)[-1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert len(abis) == 1 and abis <= {'armeabi-v7a', 'arm64-v8a'}, (apk, abis)
              assert 'libmpv.so' in libraries, (apk, 'Missing native MPV player')
              packaged.update(abis)
              print(f'{apk.name}: {abis}')
          assert packaged == {'armeabi-v7a', 'arm64-v8a'}, packaged
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: nuvio-universe-arm-apks-${{ github.run_number }}
          path: androidApp/build/outputs/apk/full/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: universe-test-reports-${{ github.run_number }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore


